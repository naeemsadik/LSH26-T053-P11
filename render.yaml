services:
  - type: web
    name: routeboard
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: routeboard-api
          property: hostport
