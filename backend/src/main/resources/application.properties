server.address=0.0.0.0
server.port=${PORT:8080}
spring.application.name=routeoptimizer

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routeboard}
spring.datasource.username=${DB_USERNAME:routeboard}
spring.datasource.password=${DB_PASSWORD:routeboard}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson formatting
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# OpenAPI documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Optimization parameters
optimizer.risk-buffer-minutes=10
optimizer.local-search-max-iterations=100
optimizer.same-area-travel-buffer-minutes=10
