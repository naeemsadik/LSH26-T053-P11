name: routeboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: routeboard
      POSTGRES_USER: routeboard
      POSTGRES_PASSWORD: routeboard
    volumes:
      - routeboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeboard -d routeboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://routeboard:routeboard@postgres:5432/routeboard
      DB_USERNAME: routeboard
      DB_PASSWORD: routeboard
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  routeboard-data:
